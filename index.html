    <!-- ── Theme bootstrap ─────────────────────────────────────────────────
         Runs before first paint so the correct theme is already on <html> and
         there's no flash of the wrong one. Paired with src/components/ThemeToggle.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ghc-theme");
          var dark =
            stored === "dark" ||
            (!stored && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private browsing — fall through to the light default */
        }
      })();
    </script>

    <!-- Restore the original deep-link URL after a GitHub Pages 404.html redirect. -->
    <script>

        if (redirect) {

            redirect !== "/" &&
            redirect !== window.location.pathname + window.location.search + window.location.hash
          ) {
            window.history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
